[project]
name = "cn-curriculum-graph"
version = "0.1.0"
description = "中国课标知识依赖图 —— schema 定义与 CI 校验层"
readme = "README.md"
authors = [
    { name = "rayman yan", email = "slyyantao@gmai.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "anthropic>=0.69",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-sqlite>=3.1.0",
    # 直接 import（`pipeline/graph.py::open_checkpointer`）而非仅靠传递依赖：
    # `AsyncSqliteSaver.from_conn_string()` 不接受 serde 参数，要传自定义
    # 序列化器只能走它 docstring 里那段 `aiosqlite.connect` + `AsyncSqliteSaver(
    # conn, serde=...)` 的写法。虽然 langgraph-checkpoint-sqlite 一定会把它
    # 装上，但"我们直接 import 的东西"就该显式声明，否则上游哪天换掉异步
    # 驱动，我们会在 import 时才发现。
    "aiosqlite>=0.20",
]

[project.scripts]
ccg-validate = "cn_curriculum_graph.cli:main"
ccg-generate = "cn_curriculum_graph.pipeline.run:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
