[project]
name = "cn-curriculum-graph"
version = "0.1.0"
description = "中国课标知识依赖图 —— schema 定义与 CI 校验层"
readme = "README.md"
authors = [
    { name = "rayman yan", email = "slyyantao@gmai.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "anthropic>=0.69",
]

[project.scripts]
ccg-validate = "cn_curriculum_graph.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
