[project]
name = "toolloop"
version = "0.1.0"
description = "阶段一：零框架手写 LLM + 工具调用最小循环（沙箱文件系统任务）"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toolloop"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
